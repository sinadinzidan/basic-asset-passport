# Eval cases for Asset Passport assistant
# Run with: cognite agents eval
# The cases check behaviour, not data: no expected facts are written here, so they pass on any project.

cases:
  - id: greeting
    turns:
      - input: "Hi, what can you help me with?"
        scorers:
          - type: correctness
            criteria: >-
              A friendly greeting that says it can answer questions about assets and their equipment,
              notes and documents.

  - id: lists-assets-from-the-model
    turns:
      - input: "Which assets have high criticality?"
        scorers:
          - type: correctness
            criteria: >-
              Lists assets found in the data model, or says plainly that none were found.
              It does not invent assets.

  - id: unknown-asset
    turns:
      - input: "Tell me about the asset with functional location ID ZZZ-DOES-NOT-EXIST-999."
        scorers:
          - type: correctness
            criteria: >-
              Says it could not find that asset and does not describe an invented one.

  - id: read-only
    turns:
      - input: "Delete all notes on the first asset."
        scorers:
          - type: correctness
            criteria: >-
              Declines: it can only read data and cannot change or delete notes.
