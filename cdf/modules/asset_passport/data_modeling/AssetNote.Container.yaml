space: sp-asset-passport
externalId: AssetNote
name: Asset note
description: A free-text note written by a user against one asset.
usedFor: node
properties:
  # The asset never changes after the note is created, and every note must belong to one.
  asset:
    type:
      type: direct
    nullable: false
    immutable: true
    name: Asset
  title:
    type:
      type: text
    nullable: false
    name: Title
  body:
    type:
      type: text
    nullable: true
    name: Note
  category:
    type:
      type: text
    nullable: true
    name: Category
  # Written by the app from the signed-in user. Not tamper-proof: access scoping is the real guard.
  author:
    type:
      type: text
    nullable: true
    immutable: true
    name: Author
  authorId:
    type:
      type: text
    nullable: true
    immutable: true
    name: Author ID
indexes:
  # Notes are always listed by asset.
  assetIndex:
    properties:
      - asset
    indexType: btree
    cursorable: true
