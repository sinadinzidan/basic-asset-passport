space: sp-asset-passport
externalId: Document
name: Document
description: >-
  The one property a document adds to the core file: the asset it belongs to. The file properties themselves
  stay in the core CogniteFile, CogniteDescribable and CogniteSourceable containers.
usedFor: node
properties:
  asset:
    type:
      type: direct
    nullable: true
    name: Asset
indexes:
  # Documents are always listed by asset.
  assetIndex:
    properties:
      - asset
    indexType: btree
    cursorable: true
