# Variant: MINIMAL (AssetPassport.graphql)
# Fields a type needs to be valid; CDF fills in the rest from RMDM on publish. This is the one published.
#
# Asset Passport solution model
# Publish in a data model: space sp-asset-passport, external ID Asset_Passport.
# Notes and documents are written to the instance space sp-asset-passport-data by the app.
#
# Asset, Equipment and PI_Timeseries are imported from RMDM (space sp-dm-idi-rmdm, v1) with only the fields
# this app needs to be valid. Publishing fills in the rest of each view from RMDM, which is only
# referenced, never edited.

"Free-text note written in Asset Passport against an asset."
type Note @view(version: "v1") {
  """
  The asset this note is about.
  @name Asset
  """
  asset: Asset
  """
  Display name of the user who wrote the note.
  @name Author
  """
  author: String
  """
  CDF user identifier of the author.
  @name Author ID
  """
  authorId: String
  """
  The note text.
  @name Note
  """
  body: String
  """
  Kind of note, for example inspection or handover.
  @name Category
  """
  category: String
  """
  Short title of the note.
  @name Title
  """
  title: String!
}

"Assets represent systems that support industrial functions or processes. Assets are often called functional locations or FLOCs."
type Asset @view(space: "sp-dm-idi-rmdm", version: "v1") @import {
  name: String @mapping(space: "cdf_cdm", container: "CogniteDescribable")
  description: String @mapping(space: "cdf_cdm", container: "CogniteDescribable")
}

"Equipment represents installed technical objects."
type Equipment implements CogniteDescribable @view(space: "sp-dm-idi-rmdm", version: "v1") @import {
  name: String @mapping(space: "cdf_cdm", container: "CogniteDescribable")
  description: String @mapping(space: "cdf_cdm", container: "CogniteDescribable")
  asset: Asset @mapping(space: "cdf_cdm", container: "CogniteEquipment")
}

"Primary view for PI time series. The app finds the series of an asset through the assets relation."
type PI_Timeseries implements CogniteDescribable @view(space: "sp-dm-idi-rmdm", version: "v1") @import {
  name: String @mapping(space: "cdf_cdm", container: "CogniteDescribable")
  description: String @mapping(space: "cdf_cdm", container: "CogniteDescribable")
  assets: [Asset] @mapping(space: "cdf_cdm", container: "CogniteTimeSeries") @directRelation @limits(maxListSize: 1200)
}

"The describable core concept holds the bare minimum of information about an instance."
interface CogniteDescribable @view(space: "cdf_cdm", version: "v1") @nodeAndEdge @import {
  name: String
  description: String
}

"The CogniteSourceable core concept standardizes how source information is stored."
interface CogniteSourceable @view(space: "cdf_cdm", version: "v1") @nodeAndEdge @import {
  sourceId: String
}

"Represents files. This is what lets the Files API upload and download the content of a node."
interface CogniteFile implements CogniteDescribable & CogniteSourceable @view(space: "cdf_cdm", version: "v1") @import {
  name: String
  description: String
  sourceId: String
  mimeType: String
  isUploaded: Boolean
  uploadedTime: Timestamp
}

"A document uploaded in Asset Passport against an asset."
type Document implements CogniteFile & CogniteDescribable & CogniteSourceable @view(version: "v1") {
  name: String
  description: String
  sourceId: String
  mimeType: String
  isUploaded: Boolean
  uploadedTime: Timestamp
  """
  The asset this document is about.
  @name Asset
  """
  asset: Asset
}
